name: pages

# Publishing a release here is what changes the page, so that is the main trigger. The daily run is the self-heal:
# a deploy that failed, or a release published while Pages was down, is corrected within a day rather than staying
# stale until the next release.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/scripts/render-site.ps1'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy: a half-applied Pages deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Reads this repository's own latest release. The default token is enough, and using it keeps the API call off
      # the 60/hour unauthenticated limit.
      - name: Render site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: .github/scripts/render-site.ps1

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
